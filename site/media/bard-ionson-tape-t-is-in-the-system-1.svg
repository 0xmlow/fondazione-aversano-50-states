<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid meet" width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A12" />
  
  <!-- Background elements -->
  <g opacity="0.15">
    <path d="M150,300 Q400,150 650,300 T800,450" stroke="#4169E1" stroke-width="1.5" fill="none" stroke-dasharray="5,3" />
    <path d="M100,200 Q400,50 700,200 T800,400" stroke="#00FF41" stroke-width="1" fill="none" stroke-dasharray="3,2" />
  </g>
  
  <!-- Pulsating spiral (Entity's core) -->
  <g>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="8s" repeatCount="indefinite" />
    <path d="M400,300 Q450,250 400,200 Q350,250 400,300 Q450,350 400,400 Q350,350 400,300" 
          stroke="#00FF41" stroke-width="2" fill="none" />
    <path d="M400,300 Q470,230 400,160 Q330,230 400,300 Q470,370 400,440 Q330,370 400,300" 
          stroke="#00FF41" stroke-width="1.5" fill="none" />
    <circle cx="400" cy="300" r="8" fill="#00FF41" opacity="0.7">
      <animate attributeName="r" values="8;12;8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Dean's timeline path -->
  <path id="timeline" d="M100,450 Q300,400 400,300 Q500,200 700,150" 
        stroke="#FFC840" stroke-width="3" fill="none">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="10s" fill="freeze" />
  </path>
  
  <!-- Binary severance point -->
  <g transform="translate(400,300)">
    <text x="0" y="-10" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="4s" repeatCount="indefinite" />
      01100100 01100101 01100001 01101110
    </text>
  </g>
  
  <!-- Neural reform section -->
  <g transform="translate(500,200)">
    <path d="M0,0 Q20,-10 40,0 Q60,10 40,20 Q20,30 0,20 Q-20,10 0,0" 
          stroke="#FF0041" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite" />
    </path>
    <path d="M0,0 Q-15,-25 0,-50 Q15,-75 30,-50 Q45,-25 30,0 Q15,25 0,0" 
          stroke="#FF0041" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="12s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Dissolving military insignia -->
  <g opacity="0.7">
    <rect x="50" y="50" width="40" height="20" fill="#4169E1" rx="2">
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="2s" repeatCount="indefinite" />
    </rect>
    <polygon points="720,80 700,100 720,120 740,100" fill="#FF0041">
      <animate attributeName="opacity" values="0.7;0" dur="4s" begin="1s" repeatCount="indefinite" />
    </polygon>
    <path d="M750,500 L770,480 L790,500 L770,520 Z" fill="#FFC840">
      <animate attributeName="opacity" values="0.7;0" dur="5s" begin="0s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Procedural flickers -->
  <rect width="800" height="600" fill="#0A0A12" opacity="0">
    <animate attributeName="opacity" values="0;0.1;0" dur="0.5s" repeatCount="indefinite" />
  </rect>
</svg>